<span
  class="relative inline-flex"
  [ngClass]="className"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut()"
>
  <ng-content></ng-content>

  <!-- Template for CDK Overlay -->
  <ng-template #tooltipTemplate>
    <span
      class="pointer-events-none overflow-hidden rounded-md bg-foreground px-3 py-1.5 text-xs text-background animate-in fade-in-0 zoom-in-95"
    >
      {{ text }}
    </span>
  </ng-template>
</span>
