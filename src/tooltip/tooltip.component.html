<span
  class="relative inline-flex"
  [ngClass]="className"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut()"
>
  <ng-content></ng-content>

  <!-- Template for CDK Overlay -->
  <ng-template #tooltipTemplate>
    <span
      class="pdm-tooltip-panel pointer-events-none overflow-hidden rounded-md bg-foreground px-3 py-1.5 text-xs text-background motion-reduce:animate-none"
    >
      {{ text }}
    </span>
  </ng-template>
</span>
