<div class="relative inline-block" [ngClass]="className">
  <button
    #triggerEl
    *ngIf="showTrigger"
    type="button"
    class="inline-flex h-9 appearance-none items-center justify-center rounded-md border border-input bg-background px-3 text-sm font-medium text-foreground shadow-sm"
    [attr.aria-expanded]="open"
    [attr.aria-haspopup]="'dialog'"
    (click)="toggle()"
  >
    {{ triggerText }}
  </button>

  <!-- Trigger slot for custom trigger -->
  <ng-content select="[pdmPopoverTrigger]"></ng-content>

  <!-- Template for CDK Overlay -->
  <ng-template #panelTemplate>
    <div
      class="min-w-80 rounded-md border border-border bg-popover p-4 text-popover-foreground shadow-md"
    >
      <ng-content></ng-content>
    </div>
  </ng-template>
</div>
