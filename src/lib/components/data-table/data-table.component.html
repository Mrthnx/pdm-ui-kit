<section [ngClass]="['flex w-full flex-col', className]">
  <!-- Toolbar: Filtro + Selector de columnas -->
  <div
    *ngIf="showFilter || showColumnSelector"
    class="flex w-full flex-col gap-2 py-4 sm:flex-row sm:items-center"
  >
    <input
      *ngIf="showFilter"
      type="text"
      [placeholder]="filterPlaceholder"
      [value]="query"
      (input)="onQueryInput($event)"
      class="h-9 flex-1 rounded-md border border-input bg-transparent px-3 py-1 text-sm text-foreground shadow-sm placeholder:text-muted-foreground outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background"
    />

    <button
      *ngIf="showColumnSelector"
      type="button"
      class="inline-flex h-9 appearance-none items-center gap-2 rounded-md border border-input bg-background px-3 py-2 text-sm font-medium text-foreground shadow-sm whitespace-nowrap"
    >
      <span>{{ columnsLabel }}</span>
      <svg
        viewBox="0 0 24 24"
        class="h-4 w-4 text-foreground"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M7 10L12 15L17 10"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></path>
      </svg>
    </button>
  </div>

  <!-- Tabla con responsive -->
  <pdm-table
    variant="data"
    [responsiveStrategy]="responsiveStrategy"
    [fullBleed]="false"
  >
    <thead>
      <tr>
        <!-- Columna de selección -->
        <th *ngIf="selectable" class="w-10 px-2 py-2 text-left font-medium">
          <input
            type="checkbox"
            (change)="onToggleAll($event)"
            class="h-4 w-4 rounded-sm border border-input"
          />
        </th>

        <!-- Columnas dinámicas -->
        <th
          *ngFor="let column of effectiveColumns"
          [ngClass]="getHeaderClass(column)"
          [ngStyle]="getColumnStyle(column)"
        >
          <!-- Header sortable -->
          <button
            *ngIf="column.sortable"
            type="button"
            (click)="onSort(column)"
            class="inline-flex appearance-none items-center gap-1 rounded-sm border-0 bg-transparent px-3 py-2 text-sm hover:underline"
          >
            <span>{{ column.label }}</span>
            <svg
              viewBox="0 0 24 24"
              class="h-4 w-4"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M8 6L4 10L8 14M16 18L20 14L16 10"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </svg>
          </button>

          <!-- Header no sortable -->
          <span *ngIf="!column.sortable">{{ column.label }}</span>
        </th>

        <!-- Columna de acciones -->
        <th *ngIf="showActions" class="w-10 px-2 py-2"></th>
      </tr>
    </thead>

    <tbody>
      <!-- Filas con datos -->
      <tr *ngFor="let row of pagedRows">
        <!-- Celda de selección -->
        <td *ngIf="selectable" class="px-2 py-2">
          <input
            type="checkbox"
            [checked]="isSelected(row)"
            (change)="onToggleRow(row, $event)"
            class="h-4 w-4 rounded-sm border border-input"
          />
        </td>

        <!-- Celdas dinámicas -->
        <td
          *ngFor="let column of effectiveColumns"
          [ngClass]="getCellClass(column)"
        >
          <!-- Template personalizado si existe -->
          <ng-container *ngIf="column.cellTemplate; else defaultCell">
            <ng-container
              *ngTemplateOutlet="
                column.cellTemplate;
                context: { $implicit: row, value: row[column.key] }
              "
            >
            </ng-container>
          </ng-container>

          <!-- Renderizado default -->
          <ng-template #defaultCell>
            {{ getCellValue(row, column) }}
          </ng-template>
        </td>

        <!-- Celda de acciones -->
        <td *ngIf="showActions" class="px-2 py-2">
          <button
            type="button"
            class="inline-flex h-8 w-8 appearance-none items-center justify-center border-0 bg-transparent p-0 hover:text-foreground"
            (click)="onAction(row)"
          >
            <svg
              viewBox="0 0 24 24"
              class="h-4 w-4"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="6" cy="12" r="1.5" fill="currentColor"></circle>
              <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
              <circle cx="18" cy="12" r="1.5" fill="currentColor"></circle>
            </svg>
          </button>
        </td>
      </tr>

      <!-- Fila vacía -->
      <tr *ngIf="pagedRows.length === 0">
        <td
          [attr.colspan]="
            effectiveColumns.length +
            (selectable ? 1 : 0) +
            (showActions ? 1 : 0)
          "
          class="px-3 py-6 text-center text-sm text-muted-foreground"
        >
          {{ emptyLabel }}
        </td>
      </tr>
    </tbody>
  </pdm-table>

  <!-- Footer: Info + Paginación -->
  <div
    *ngIf="showPagination || selectable"
    class="flex w-full flex-wrap items-center gap-2 py-4 sm:flex-nowrap"
  >
    <p
      *ngIf="selectable"
      class="m-0 flex-1 pr-2 text-sm text-muted-foreground whitespace-nowrap"
    >
      {{ selectedCount }} of {{ rows.length }} {{ rowsSelectedLabel }}
    </p>

    <div *ngIf="showPagination" class="flex items-center gap-2 ml-auto">
      <span class="text-sm text-muted-foreground whitespace-nowrap">
        Page {{ page }} of {{ totalPages }}
      </span>
      <button
        type="button"
        class="h-9 appearance-none rounded-md border border-input bg-background px-4 text-sm font-medium text-foreground shadow-sm ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="page <= 1"
        (click)="previous()"
      >
        {{ previousLabel }}
      </button>
      <button
        type="button"
        class="h-9 appearance-none rounded-md border border-input bg-background px-4 text-sm font-medium text-foreground shadow-sm ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="page >= totalPages"
        (click)="next()"
      >
        {{ nextLabel }}
      </button>
    </div>
  </div>
</section>
