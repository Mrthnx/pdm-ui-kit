<nav
  role="menubar"
  [ngClass]="[
    'inline-flex h-9 items-center gap-0.5 rounded-md border border-solid border-border bg-background p-1 shadow-sm',
    className,
  ]"
>
  <div *ngFor="let menu of menus; let i = index" class="relative">
    <button
      type="button"
      class="inline-flex h-7 appearance-none box-border items-center rounded-sm border-0 bg-transparent px-3 text-sm text-foreground hover:bg-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background"
      [attr.aria-expanded]="openIndex === i"
      (click)="toggle(i, $event)"
    >
      {{ menu.label }}
    </button>
  </div>

  <!-- Template for CDK Overlay -->
  <ng-template #menuTemplate>
    <div
      class="min-w-40 rounded-md border border-solid border-border bg-popover p-1 text-popover-foreground shadow-md sm:min-w-48"
    >
      <button
        *ngFor="let item of menus[openIndex]?.items || []"
        type="button"
        [disabled]="item.disabled || !item.value"
        class="relative flex w-full appearance-none box-border cursor-default select-none items-center rounded-sm border-0 bg-transparent px-2 py-1.5 text-sm outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:bg-accent focus-visible:text-accent-foreground disabled:pointer-events-none disabled:opacity-50"
        (click)="selectItem(item)"
      >
        {{ item.label }}
      </button>
    </div>
  </ng-template>
</nav>
