<nav
  aria-label="breadcrumb"
  [ngClass]="[
    'inline-flex items-center gap-1.5 text-sm',
    mode === 'responsive' ? 'overflow-x-auto max-w-full pb-1 scrollbar-thin' : '',
    className
  ]"
>
  <ng-container *ngFor="let item of renderedItems; let i = index; let last = last">
    <!-- Item text -->
    <span 
      [ngClass]="[
        last ? 'text-foreground font-medium' : 'text-muted-foreground hover:text-foreground transition-colors cursor-pointer',
        mode === 'responsive' && !shouldShowInMobile(i) ? 'hidden sm:inline' : '',
        'whitespace-nowrap'
      ]">
      {{ item }}
    </span>

    <!-- Separator -->
    <ng-container *ngIf="!last">
      <span 
        [ngClass]="[
          'inline-flex h-6 w-6 flex-shrink-0 items-center justify-center text-muted-foreground',
          mode === 'responsive' && !shouldShowInMobile(i) && !shouldShowInMobile(i + 1) ? 'hidden sm:inline-flex' : ''
        ]" 
        aria-hidden="true">
        <!-- Custom separator (slash) -->
        <svg
          *ngIf="mode === 'custom-separator' && item !== '...'"
          viewBox="0 0 24 24"
          class="h-4 w-4"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M8 20L16 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        
        <!-- Default separator (chevron) -->
        <svg
          *ngIf="(mode !== 'custom-separator' && item !== '...') || item === '...'"
          viewBox="0 0 24 24"
          class="h-4 w-4"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      
      <!-- Ellipsis indicator for responsive mode (only shown when items are hidden) -->
      <span 
        *ngIf="mode === 'responsive' && !shouldShowInMobile(i) && i === 0"
        class="inline-flex sm:hidden text-muted-foreground">
        ...
      </span>
    </ng-container>

    <!-- Dropdown indicator -->
    <ng-container *ngIf="mode === 'dropdown' && i === 1 && item !== '...' && !last">
      <span class="-ml-2 inline-flex h-6 w-6 items-center justify-center text-muted-foreground" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
    </ng-container>
  </ng-container>
</nav>
