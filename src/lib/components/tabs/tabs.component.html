<div [ngClass]="['w-full', className]">
  <div
    role="tablist"
    class="inline-flex h-8 w-full items-center overflow-x-auto scrollbar-thin rounded-lg bg-muted p-[3px] text-muted-foreground md:w-fit"
  >
    <button
      *ngFor="let item of items"
      role="tab"
      [attr.aria-selected]="value === item.value"
      [disabled]="item.disabled"
      [ngClass]="[
        'relative inline-flex h-[calc(100%-1px)] appearance-none box-border flex-1 items-center justify-center gap-1.5 whitespace-nowrap rounded-md border border-transparent px-3 py-0.5 text-sm font-medium transition-all focus-visible:border-ring focus-visible:outline-none focus-visible:outline-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 md:flex-initial md:px-4',
        value === item.value ? 'bg-background text-foreground shadow-sm' : 'bg-transparent text-muted-foreground'
      ]"
      (click)="select(item)"
      type="button"
    >
      {{ item.label }}
    </button>
  </div>
  <div class="mt-4">
    <ng-content></ng-content>
  </div>
</div>
