<div
  class="relative inline-flex"
  [ngClass]="className"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut()"
>
  <div>
    <ng-content select="[pdmHoverTrigger]"></ng-content>
  </div>

  <!-- Template for CDK Overlay -->
  <ng-template #panelTemplate>
    <section
      [style.width.px]="panelWidth"
      class="rounded-md border border-solid border-border bg-popover p-4 text-popover-foreground shadow-md"
    >
      <ng-content select="[pdmHoverContent]"></ng-content>
    </section>
  </ng-template>
</div>
