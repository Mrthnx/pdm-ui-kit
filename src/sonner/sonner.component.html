<ng-container *ngIf="!hasToasts">
  <div [ngClass]="['flex w-full max-w-sm items-start gap-3 rounded-lg border border-solid p-4 shadow-lg', toneClass, className]" role="status" aria-live="polite">
    <div class="grid gap-0.5">
      <p *ngIf="title" class="m-0 text-sm font-semibold">{{ title }}</p>
      <p *ngIf="description" class="m-0 text-sm opacity-90">{{ description }}</p>
      <ng-content></ng-content>
    </div>
    <button type="button" class="ml-auto appearance-none box-border rounded-sm border-0 bg-transparent p-0 opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:pointer-events-none" (click)="dismissed.emit()" aria-label="Dismiss">
      <pdm-icon name="x" [size]="14"></pdm-icon>
    </button>
  </div>
</ng-container>

<ng-container *ngIf="hasToasts">
  <div [ngClass]="['fixed bottom-4 right-4 z-[100] flex w-full max-w-sm flex-col gap-2', className]" role="region" aria-label="Notifications">
    <div *ngFor="let entry of visibleToasts; trackBy: trackByKey" [ngClass]="['flex w-full items-start gap-3 rounded-lg border border-solid p-4 shadow-lg', toneClassFor(entry.toast.tone)]" role="status" aria-live="polite">
      <div class="grid gap-0.5">
        <p *ngIf="entry.toast.title" class="m-0 text-sm font-semibold">{{ entry.toast.title }}</p>
        <p *ngIf="entry.toast.description" class="m-0 text-sm opacity-90">{{ entry.toast.description }}</p>
      </div>
      <button type="button" class="ml-auto appearance-none box-border rounded-sm border-0 bg-transparent p-0 opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:pointer-events-none" (click)="dismissToast(entry.toast, entry.key)" aria-label="Dismiss">
        <pdm-icon name="x" [size]="14"></pdm-icon>
      </button>
    </div>
  </div>
</ng-container>
