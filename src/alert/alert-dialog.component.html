<button
  *ngIf="showTrigger && !open"
  type="button"
  class="inline-flex h-9 appearance-none box-border items-center justify-center rounded-md border border-solid border-input bg-background px-4 py-2 text-sm font-medium text-foreground shadow-sm"
  (click)="onTriggerClick()"
>
  {{ triggerText }}
</button>

<div *ngIf="open" [ngClass]="containerClassName">
  <div class="absolute inset-0 bg-foreground/30 backdrop-blur-sm" (click)="onBackdropClick()"></div>
  <section role="alertdialog" aria-modal="true" cdkTrapFocus [ngClass]="panelClassName">
    <div class="flex flex-col gap-2 p-4 sm:p-6">
      <h2 class="m-0 text-lg font-semibold leading-none tracking-tight text-foreground">{{ title }}</h2>
      <p *ngIf="description" class="m-0 text-sm text-muted-foreground">{{ description }}</p>
    </div>
    <div [ngClass]="bodyWrapperClassName">
      <ng-content></ng-content>
    </div>
    <div *ngIf="showFooter" class="flex flex-col gap-2 p-4 sm:p-6 border-t border-border sm:flex-row sm:justify-end">
      <button type="button" class="inline-flex h-9 w-full appearance-none box-border items-center justify-center rounded-md border border-solid border-input bg-background px-4 py-2 text-sm font-medium text-foreground shadow-sm sm:w-auto" (click)="onCancel()">{{ cancelText }}</button>
      <button type="button" class="inline-flex h-9 w-full appearance-none box-border items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground shadow-sm sm:w-auto" (click)="onConfirm()">{{ confirmText }}</button>
    </div>
  </section>
</div>
